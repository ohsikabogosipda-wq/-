<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>포켓 워크</title>
<style>
html,body{
  margin:0;height:100%;overflow:hidden;background:#e6e4df;
  touch-action:none;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#dev{
  position:fixed;inset:0;width:100%;height:100%;overflow:visible;display:block;
  font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
#lamp{fill:#b9b7b0}
#lamp[data-mode="play"]{fill:#e2612c}
#lamp[data-mode="ff"],#lamp[data-mode="rew"],#lamp[data-mode="swap"]{fill:#e2612c;animation:blink .5s linear infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}

#keepBtn{cursor:pointer}
#keepBtn .kbg{fill:none;stroke:#b3b0a8;stroke-width:1.4;pointer-events:all}
#keepBtn .ktxt{fill:#5a5f65}
#keepBtn .kicon rect{fill:#5a5f65}
#keepBtn .kicon path{stroke:#5a5f65}
#keepBtn .shut{display:none}
#keepBtn[data-on="1"] .kbg{fill:#1f2226;stroke:#1f2226}
#keepBtn[data-on="1"] .ktxt{fill:#f3eddf}
#keepBtn[data-on="1"] .kicon rect{fill:#f3eddf}
#keepBtn[data-on="1"] .kicon path{stroke:#f3eddf}
#keepBtn[data-on="1"] .shut{display:inline}
#keepBtn[data-on="1"] .sopen{display:none}

#closeBtn{cursor:pointer}
#closeBtn .cbg{fill:none;stroke:#b3b0a8;stroke-width:1.4;pointer-events:all}
#closeBtn .ctxt{fill:#5a5f65}
#closeBtn .cicon path{stroke:#5a5f65}
#closeBtn[data-arm="1"] .cbg{fill:#e2612c;stroke:#e2612c}
#closeBtn[data-arm="1"] .ctxt{fill:#fff}
#closeBtn[data-arm="1"] .cicon path{stroke:#fff}

/* ---- 아이팟 커버플로우 ---- */
:root{--S:200px}
#cf{
  position:fixed;inset:0;display:none;z-index:20;overflow:hidden;touch-action:none;
  background:radial-gradient(90% 75% at 50% 32%,#202024 0%,#08080a 68%,#000 100%);
  color:#f3eddf;user-select:none;-webkit-user-select:none;
  font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
#cfBar{
  position:absolute;left:0;right:0;top:0;height:11vh;min-height:34px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-left));
  font-size:12.5px;font-weight:600;color:#a9a496;
}
#cfCancel{color:#e2612c;padding:12px 18px 12px 0}
#cfCount{min-width:60px;text-align:right}
#cfStage{
  position:absolute;left:0;right:0;top:13vh;height:var(--S);
  perspective:calc(var(--S) * 3.4);perspective-origin:50% 45%;transform-style:preserve-3d;
}
.card{
  position:absolute;top:0;left:calc(50% - var(--S) / 2);width:var(--S);height:var(--S);
  background:#111;will-change:transform;
  -webkit-box-reflect:below 2px linear-gradient(to bottom,transparent 56%,rgba(255,255,255,.32));
}
.face{width:100%;height:100%;background-size:cover;background-position:center;position:relative;box-sizing:border-box}
.face.gen{display:flex;flex-direction:column;justify-content:flex-end;padding:9%}
.face.gen::before{content:"";position:absolute;left:0;right:0;top:0;height:7%;background:#e2612c}
.face.gen b{font-size:calc(var(--S) * .105);line-height:1.2;font-weight:700;color:#f3eddf}
.face.gen i{font-size:calc(var(--S) * .066);line-height:1.3;font-style:normal;font-weight:500;color:#e7e0cd;opacity:.75;margin-top:4%}
#cfEmpty{position:absolute;left:0;right:0;top:34%;text-align:center}
#cfEmpty1{font-size:15px;color:#d8d3c6}
#cfEmpty2{font-size:12px;color:#8d8a80;margin-top:6px}
#cfInfo{position:absolute;left:0;right:0;bottom:7vh;text-align:center;padding:0 24px}
#cfTitle{font-size:15px;font-weight:700;color:#fff;line-height:1.3}
#cfArtist{font-size:12.5px;color:#b9b4a6;margin-top:3px}
#cfHint{position:absolute;left:0;right:0;bottom:1.8vh;text-align:center;font-size:11px;color:#77746a}

@media (prefers-reduced-motion:reduce){
  #lamp[data-mode="ff"],#lamp[data-mode="rew"]{animation:none}
}
</style>
</head>
<body>
<svg id="dev" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="카세트 플레이어">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="400">
      <stop offset="0" stop-color="#efede9"/><stop offset="1" stop-color="#e2e0da"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3036"/><stop offset="1" stop-color="#1b1e22"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#474d55"/><stop offset="1" stop-color="#31363c"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d0f"/><stop offset="1" stop-color="#181b1f"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="165%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1a1c20" flood-opacity=".28"/>
    </filter>
    <clipPath id="doorClip"><rect x="28" y="28" width="496" height="344" rx="26"/></clipPath>
    <clipPath id="artClip"><rect x="32" y="27" width="54" height="54" rx="4"/></clipPath>
    <clipPath id="winClip"><rect x="60" y="96" width="200" height="64" rx="32"/></clipPath>
  </defs>

  <rect x="-900" y="-600" width="2600" height="1600" fill="url(#bg)"/>

  <!-- 카세트 (길게 누르면 음악 연결) -->
  <g id="door">
    <rect x="28" y="28" width="496" height="344" rx="26" fill="url(#panel)" filter="url(#drop)"/>
    <rect x="28.5" y="28.5" width="495" height="343" rx="25.5" fill="none" stroke="#fff" stroke-opacity=".07"/>
    <g clip-path="url(#doorClip)"><g id="cassette" transform="translate(42 57) scale(1.46)">
      <rect x="4" y="4" width="312" height="188" rx="14" fill="url(#shell)"/>
      <rect x="4.5" y="4.5" width="311" height="187" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
      <rect x="24" y="16" width="272" height="72" rx="6" fill="#f3eddf"/>
      <path d="M24 24 V22 a6 6 0 0 1 6 -6 H290 a6 6 0 0 1 6 6 V24 Z" fill="#e2612c"/>
      <line x1="40" y1="82" x2="280" y2="82" stroke="#ddd5c0" stroke-width="1"/>
      <text id="title" x="160" y="57" text-anchor="middle" font-size="18" font-weight="700" fill="#22252a">데모 테이프</text>
      <text id="sub" x="160" y="73" text-anchor="middle" font-size="11" fill="#7b7261">로파이 84bpm</text>
      <image id="labelArt" x="32" y="27" width="54" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#artClip)" style="display:none"/>

      <rect x="60" y="96" width="200" height="64" rx="32" fill="url(#win)"/>
      <g clip-path="url(#winClip)">
        <circle id="tapeL" cx="110" cy="128" r="30" fill="#3f2c21"/>
        <circle id="tapeR" cx="210" cy="128" r="13" fill="#3f2c21"/>
        <line id="run" x1="110" y1="158" x2="210" y2="141" stroke="#3f2c21" stroke-width="2.5"/>
        <g id="hubL"></g>
        <g id="hubR"></g>
      </g>
      <rect x="60.5" y="96.5" width="199" height="63" rx="31.5" fill="none" stroke="#fff" stroke-opacity=".08"/>

      <path d="M96 168 h128 l10 24 h-148 z" fill="#25292e"/>
      <circle cx="130" cy="181" r="4" fill="#111316"/>
      <circle cx="190" cy="181" r="4" fill="#111316"/>
      <g fill="#282c32" stroke="#fff" stroke-opacity=".12" stroke-width=".8">
        <circle cx="15" cy="15" r="3.4"/><circle cx="305" cy="15" r="3.4"/>
        <circle cx="15" cy="181" r="3.4"/><circle cx="305" cy="181" r="3.4"/>
      </g>
    </g></g>
  </g>

  <!-- 오른쪽 정보 -->
  <text x="556" y="57" font-size="16" font-weight="600" letter-spacing=".4" fill="#1f2226">포켓 워크</text>

  <g id="closeBtn" role="button" aria-label="닫기">
    <rect x="660" y="22" width="130" height="60" fill="transparent" pointer-events="all"/>
    <rect class="cbg" x="680" y="36" width="96" height="32" rx="16"/>
    <g class="cicon" transform="translate(697 46.5)"><path d="M0 0L11 11M11 0L0 11" fill="none" stroke-width="1.8" stroke-linecap="round"/></g>
    <text id="closeTxt" class="ctxt" x="716" y="56.5" font-size="12" font-weight="500">닫기</text>
  </g>

  <g id="keepBtn" role="button" aria-pressed="true" aria-label="화면 유지" data-on="1">
    <rect x="650" y="92" width="140" height="48" fill="transparent" pointer-events="all"/>
    <rect class="kbg" x="664" y="101" width="112" height="30" rx="15"/>
    <g class="kicon" transform="translate(679 107.1)">
      <rect x="0" y="7" width="13" height="10" rx="2.2"/>
      <path class="shut" d="M2.5 7V4.8a4 4 0 0 1 8 0V7" fill="none" stroke-width="1.8" stroke-linecap="round"/>
      <path class="sopen" d="M2.5 7V4.8a4 4 0 0 1 8 0" fill="none" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text class="ktxt" x="699" y="120.5" font-size="12" font-weight="500">화면 유지</text>
  </g>

  <circle id="lamp" cx="560" cy="116" r="4" data-mode="stop"/>
  <text id="modeText" x="572" y="120.5" font-size="12.5" font-weight="500" letter-spacing=".3" fill="#6d7278">정지</text>

  <text id="time" x="554" y="184" font-size="58" font-weight="300" letter-spacing="-1.5" fill="#1f2226" style="font-variant-numeric:tabular-nums">00:00</text>
  <text id="total" x="776" y="184" font-size="15" text-anchor="end" fill="#8a8f95" style="font-variant-numeric:tabular-nums">/ 00:00</text>

  <rect x="556" y="208" width="220" height="3" rx="1.5" fill="#d6d4ce"/>
  <rect id="prog" x="556" y="208" width="0" height="3" rx="1.5" fill="#e2612c"/>
  <circle id="knob" cx="556" cy="209.5" r="5.5" fill="#e2612c" stroke="#ecebe7" stroke-width="2"/>

  <text id="msg" x="556" y="240" font-size="12" fill="#8a8f95"></text>

  <line x1="556" y1="284" x2="776" y2="284" stroke="#d6d4ce" stroke-width="1"/>
  <g font-size="11.5">
    <text id="k1" x="556" y="304" font-weight="600" fill="#4c5157"></text><text id="v1" x="640" y="304" fill="#8a8f95"></text>
    <text id="k2" x="556" y="320" font-weight="600" fill="#4c5157"></text><text id="v2" x="640" y="320" fill="#8a8f95"></text>
    <text id="k3" x="556" y="336" font-weight="600" fill="#4c5157"></text><text id="v3" x="640" y="336" fill="#8a8f95"></text>
    <text id="k4" x="556" y="352" font-weight="600" fill="#4c5157"></text><text id="v4" x="640" y="352" fill="#8a8f95"></text>
    <text id="k5" x="556" y="368" font-weight="600" fill="#4c5157"></text><text id="v5" x="640" y="368" fill="#8a8f95"></text>
  </g>
</svg>

<input type="file" id="file" accept="audio/*" hidden>

<div id="cf">
  <div id="cfBar"><span id="cfCancel">‹ 취소</span><span id="cfSrc"></span><span id="cfCount"></span></div>
  <div id="cfStage"></div>
  <div id="cfEmpty"><div id="cfEmpty1"></div><div id="cfEmpty2"></div></div>
  <div id="cfInfo"><div id="cfTitle"></div><div id="cfArtist"></div></div>
  <div id="cfHint">옆으로 넘겨 고르고, 아래로 쓸어서 카세트에 넣기</div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const AC = window.AudioContext || window.webkitAudioContext;
const NS = 'http://www.w3.org/2000/svg';
const NATIVE = typeof window.NativeHost !== 'undefined';

const el = {
  tapeL:$('tapeL'), tapeR:$('tapeR'), hubL:$('hubL'), hubR:$('hubR'), run:$('run'),
  title:$('title'), sub:$('sub'), modeText:$('modeText'), time:$('time'), total:$('total'),
  prog:$('prog'), lamp:$('lamp'), msg:$('msg'), file:$('file'), keep:$('keepBtn'), close:$('closeBtn'), closeTxt:$('closeTxt'),
  knob:$('knob'),
  cassette:$('cassette'), labelArt:$('labelArt'),
  k:[1,2,3,4,5].map(i => $('k' + i)), v:[1,2,3,4,5].map(i => $('v' + i))
};

if (!NATIVE) el.close.style.display = 'none';   // 닫기 버튼은 앱에서만

const svgEl = (parent, tag, attrs) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};

/* ---------- 그림 만들기 ---------- */
const CL = {x:110, y:128}, CR = {x:210, y:128};
const RMIN = 13, RMAX = 30;

function buildHub(g, cx, cy){
  svgEl(g, 'circle', {cx, cy, r:12, fill:'#e6e2d6'});
  svgEl(g, 'circle', {cx, cy, r:7.5, fill:'#14171a'});
  for (let i = 0; i < 6; i++){
    svgEl(g, 'rect', {x:cx-1.3, y:cy-7.6, width:2.6, height:4.2, fill:'#e6e2d6', transform:`rotate(${i*60} ${cx} ${cy})`});
  }
}
buildHub(el.hubL, CL.x, CL.y);
buildHub(el.hubR, CR.x, CR.y);

// 안내 문구
const legend = NATIVE
  ? [['톡','재생 · 정지'], ['볼륨 + / −','뒤로 · 앞으로 감기'], ['좌우 쓸기','곡 바꾸기'], ['위로 쓸기','앨범 고르기'], ['카세트 길게','음악 앱 연결']]
  : [['톡','재생 · 정지'], ['양쪽 끝','뒤로 · 앞으로 감기'], ['좌우 쓸기','곡 바꾸기'], ['위로 쓸기','앨범 고르기'], ['카세트 길게','음악 넣기']];
legend.forEach(([k, v], i) => { el.k[i].textContent = k; el.v[i].textContent = v; });

/* ---------- 오디오 상태 ---------- */
let ctx = null, gain = null, analyser = null, freq = null;
let buffer = null, revBuffer = null, duration = 0;
let demoBuf = null;
let src = null;
let mode = 'stop';          // 실제 동작: stop | play | ff | rew
let baseMode = 'stop';      // 감기를 멈췄을 때 돌아갈 상태
let seekHold = null;        // 감기 중인 방향: ff | rew | null
let seekStart = 0, releaseTimer = null;
let pos = 0, t0 = 0, p0 = 0, dir = 1, rate = 1;
const SEEK_RATE = 4;
const MIN_SEEK_MS = 0;      // 버튼을 떼면 바로 멈춘다 (누르는 동안만 감기)

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const fmt = s => {
  s = Math.max(0, Math.floor(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};
const setNote = t => { el.msg.textContent = t; };

/* ---------- 카세트 갈아끼우기 (곡이 바뀔 때) ---------- */
const SWAP_OUT_MS = 340, SWAP_IN_MS = 560, SWAP_WAIT_MAX_MS = 1200, SWAP_DIST = 560;
let swap = null;            // {phase:'out'|'wait'|'in', t0, dir, thunked}
let pendingLabel = null;    // 새 카세트에 붙일 라벨 {title, sub}
let pendingDir = 0;
let swapWasActive = false;

const drawer = {state:'closed', t0:0, items:[], sel:0, scroll:0, drag:null, pull:0, rank0:0};
let expectTitle = null, pickTimer = null;
let playHistory = [];
try { playHistory = JSON.parse(localStorage.getItem('pw_hist') || '[]'); } catch(e){}
const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
function saveHistory(){
  try { localStorage.setItem('pw_hist', JSON.stringify(playHistory)); return; } catch(e){}
  playHistory.forEach((h, i) => { if (i >= 12) h.art = ''; });          // 저장 공간이 모자라면 오래된 커버부터 뺀다
  try { localStorage.setItem('pw_hist', JSON.stringify(playHistory)); } catch(e){}
}
function pushHistory(title, artist, art){
  playHistory = playHistory.filter(h => norm(h.title) !== norm(title) || norm(h.artist) !== norm(artist));
  playHistory.unshift({title, artist: artist || '', art: art || ''});
  if (playHistory.length > 40) playHistory.length = 40;
  saveHistory();
}
function attachArt(title, artist, art){
  const h = playHistory.find(x => norm(x.title) === norm(title) && norm(x.artist) === norm(artist));
  if (h && !h.art){ h.art = art; saveHistory(); }
}

function vibe(kind){
  if (NATIVE){ try { window.NativeHost.haptic(kind); } catch(e){} return; }
  if (!ctx) return;
  if (kind === 'tick') tickSnd(); else if (kind === 'eject') clack(); else thunk();
}
function startInsert(label){                    // 곡 서랍에서 고른 카세트를 위에서 끼워 넣는다
  if (swap) return false;
  const now = performance.now();
  swap = {phase:'wait', axis:'y', t0: now, dir: 1, thunked: false, hold: now + 200};
  if (label) pendingLabel = label;
  return true;
}
function startSwap(dir){
  if (swap) return false;
  swap = {phase:'out', t0: performance.now(), dir: dir || 1, thunked: false};
  vibe('eject');
  return true;
}
const easeOutBack = k => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function stepSwap(now){
  if (!swap){
    if (swapWasActive){ swapWasActive = false; return {dx:0, dy:0, rot:0}; }
    return null;
  }
  swapWasActive = true;
  const t = now - swap.t0, d = swap.dir;
  if (swap.phase === 'out'){                      // 1) 빠져나간다
    const k = Math.min(1, t / SWAP_OUT_MS);
    if (k >= 1){ swap.phase = 'wait'; swap.t0 = now; }
    const e = k * k * k;
    return {dx: -d * SWAP_DIST * e, dy: 10 * e, rot: -d * 4 * e};
  }
  if (swap.phase === 'wait'){                     // 2) 새 카세트(라벨)를 기다린다
    if ((pendingLabel || t > (NATIVE ? SWAP_WAIT_MAX_MS : 10000)) && now >= (swap.hold || 0)){   // 웹 미리보기는 새 테이프를 만드는 시간을 더 기다린다
      if (pendingLabel){ setLabel(pendingLabel.title, pendingLabel.sub, pendingLabel.art); pendingLabel = null; }
      swap.phase = 'in'; swap.t0 = now;
    }
    return swap.axis === 'y' ? {dx:0, dy:-400, rot:0} : {dx: -d * SWAP_DIST, dy: 10, rot: -d * 4};
  }
  const k = Math.min(1, t / SWAP_IN_MS);          // 3) 반대쪽에서 들어와 딱 끼워진다
  const off = 1 - easeOutBack(k);
  if (!swap.thunked && k > 0.55){ swap.thunked = true; vibe('insert'); }
  if (k >= 1){
    swap = null;
    if (!NATIVE) apply();
    return {dx:0, dy:0, rot:0};
  }
  if (swap.axis === 'y') return {dx:0, dy: -400 * off, rot: 3 * off};      // 위에서 내려와 찰칵
  return {dx: d * SWAP_DIST * off, dy: -14 * off, rot: d * 4 * off};
}

/* ---------- 앱 모드: 폰에서 지금 나오는 음악의 상태(안드로이드가 알려줌) ---------- */
const sys = {granted:false, active:false, playing:false, pos:0, dur:0, at:0, key:'', title:'', artist:'', queue:{active:'', items:[]}, trackKey:'', art:''};
let hasTrack = false;       // 카세트에 곡 라벨이 붙어 있는지
function refreshLabel(o){
  if (!sys.granted){
    hasTrack = false;
    setLabel('연결이 필요해요', '카세트를 길게 눌러 허용');
    setNote('알림 접근을 허용해 주세요');
  } else if (!sys.active){
    hasTrack = false;
    setLabel('테이프 없음', '음악 앱에서 재생해 보세요');
    setNote('');
  } else {
    const label = {title: o.title || '재생 중인 음악', sub: (o.artist || '').slice(0, 26), art: sys.art || ''};
    setNote('');
    if (hasTrack){            // 곡이 바뀌었다
      if (expectTitle && norm(label.title) === norm(expectTitle)){   // 내가 고른 곡이 실제로 재생되기 시작함
        expectTitle = null; clearTimeout(pickTimer);
        if (swap) pendingLabel = label; else setLabel(label.title, label.sub, label.art);
      } else {                // -> 카세트를 갈아끼운다
        pendingLabel = label;
        if (!swap) startSwap(pendingDir || 1);
        pendingDir = 0;
      }
    } else {

function initCtx(){
  if (!AC){ setNote('소리 재생을 지원하지 않는 환경이에요'); return; }
  if (!ctx){
    ctx = new AC();
    gain = ctx.createGain();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.6;
    gain.connect(analyser);
    analyser.connect(ctx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
  }
  if (ctx.state === 'suspended') ctx.resume();
}

function clack(){
  if (!ctx) return;
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.04);
  g.gain.setValueAtTime(0.16, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.06);
}

function tickSnd(){
  if (!ctx) return;
  const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square'; o.frequency.value = 1400;
  g.gain.setValueAtTime(0.04, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.02);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.03);
}
function thunk(){
  if (!ctx) return;
  const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.18);

/* ---------- 데모 음악 (직접 합성) ---------- */
async function buildDemo(bpm = 84, seed0 = 7){
  const sr = 44100, beat = 60 / bpm, nbars = 16, dur = nbars * 4 * beat;
  const oc = new OfflineAudioContext(2, Math.ceil(dur * sr), sr);
  const master = oc.createGain(); master.gain.value = 0.55;
  const lp = oc.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800; lp.Q.value = 0.5;
  master.connect(lp); lp.connect(oc.destination);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  const tone = (m, t, len, type, vol, pan = 0) => {
    const o = oc.createOscillator(), g = oc.createGain();
    o.type = type; o.frequency.value = mtof(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g);
    if (oc.createStereoPanner){
      const p = oc.createStereoPanner(); p.pan.value = pan;
      g.connect(p); p.connect(master);
    } else g.connect(master);
    o.start(t); o.stop(t + len + 0.02);
  };

  const nb = oc.createBuffer(1, sr, sr), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const noise = (t, len, type, f, vol) => {
    const s = oc.createBufferSource(); s.buffer = nb; s.loop = true;
    const flt = oc.createBiquadFilter(); flt.type = type; flt.frequency.value = f;
    const g = oc.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(flt); flt.connect(g); g.connect(master);
    s.start(t); s.stop(t + len + 0.02);
  };
  const kick = t => {
    const o = oc.createOscillator(), g = oc.createGain();
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.3);
  };

  const prog = [
    {bass:45, ch:[57,60,64,67]},   // Am7
    {bass:41, ch:[53,57,60,64]},   // Fmaj7
    {bass:48, ch:[55,59,64,67]},   // Cmaj7
    {bass:43, ch:[55,59,62,64]}    // G6
  ];
  const scale = [69,72,74,76,79,81];
  let seed = seed0;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  for (let b = 0; b < nbars; b++){
    const c = prog[b % 4], t = b * 4 * beat;
    c.ch.forEach((m, i) => tone(m, t + i * 0.012, 4 * beat * 0.98, 'triangle', 0.05, i % 2 ? 0.3 : -0.3));
    tone(c.bass, t, beat * 1.8, 'sine', 0.22);
    tone(c.bass, t + 2.5 * beat, beat * 1.2, 'sine', 0.16);
    kick(t); kick(t + 2 * beat);
    if (b % 2) kick(t + 3.5 * beat);
    noise(t + beat, 0.16, 'bandpass', 1800, 0.35);
    noise(t + 3 * beat, 0.16, 'bandpass', 1800, 0.35);
    for (let h = 0; h < 8; h++){
      const sw = h % 2 ? beat * 0.05 : 0;
      noise(t + h * beat / 2 + sw, 0.05, 'highpass', 7000, h % 2 ? 0.10 : 0.16);
    }
    for (let e = 0; e < 8; e++){
      if (b >= 2 && rnd() < 0.45){
        const m = scale[Math.floor(rnd() * scale.length)];
        const sw = e % 2 ? beat * 0.05 : 0;
        tone(m, t + e * beat / 2 + sw, beat * 0.9, 'triangle', 0.09, 0.2);
      }
    }
  }
  return await oc.startRendering();
}

function stopSource(){
  if (src){

  if (mode === 'ff' && pos >= duration - 0.05) return;
  if (rev && pos <= 0.05) return;
  const s = ctx.createBufferSource();
  s.buffer = rev ? revBuffer : buffer;
  s.playbackRate.value = mode === 'play' ? 1 : SEEK_RATE;
  gain.gain.value = mode === 'play' ? 1 : 0.5;

  if (!expectTitle) return;
  expectTitle = null;
  flashNote('이 음악 앱은 곡 직접 고르기를 지원하지 않는 것 같아요');
  setLabel(sys.title || '재생 중인 음악', (sys.artist || '').slice(0, 26), sys.art);
}
async function webPickTape(idx){               // 웹 미리보기: 고른 데모 테이프를 끼운다
  initCtx();
  if (!startInsert()) return;
  stopSource(); pos = 0;
  tapeIdx = idx;
  const t = TAPES[idx];
  try {
    if (!tapeBufs[idx]) tapeBufs[idx] = await buildDemo(t.bpm, t.seed);
    installBuffer(tapeBufs[idx]);
  } catch(e){}
  pendingLabel = {title: t.name, sub: t.sub};
}
function commitInsert(){
  const it = drawer.items[drawer.sel];
  if (!it || drawer.state === 'inserting' || drawer.state === 'closing') return;
  drawer.pullStart = drawer.pull;             // 끌어내린 자리에서 이어서 카세트 쪽으로 내려간다
  drawer.state = 'inserting'; drawer.t0 = performance.now(); drawer.drag = null;
  if (!NATIVE){ webPickTape(it.idx); return; }
  const label = {title: it.title, sub: clipText(it.artist, 26), art: it.art || ''};
  if (!startInsert(label)) return;
  if (norm(it.title) !== norm(sys.title)){
    expectTitle = it.title;
    clearTimeout(pickTimer);
    pickTimer = setTimeout(pickTimedOut, 4500);
  }
  try {
    if (it.kind === 'queue') window.NativeHost.playQueueItem(String(it.id));
    else window.NativeHost.playSearch((it.title + ' ' + (it.artist || '')).trim());
  } catch(e){}
}
function renderDrawer(now, dt){
  const el0 = now - drawer.t0, S = cf.S;
  let fade = 1;
  if (drawer.state === 'opening'){
    drawer.openK = Math.min(1, el0 / 520);
    fade = Math.min(1, el0 / 200);
    if (el0 >= 520) drawer.state = 'open';
  } else if (drawer.state === 'closing' || drawer.state === 'inserting'){
    const k = Math.min(1, el0 / (drawer.state === 'inserting' ? 300 : 220));
    fade = 1 - k;
    if (drawer.state === 'inserting') drawer.pull = drawer.pullStart + (S * 1.15 - drawer.pullStart) * k * k;
    if (k >= 1){
      drawer.state = 'closed'; cf.el.style.display = 'none'; cf.el.style.opacity = '';
      cf.stage.textContent = ''; cf.cards = []; return;
    }
  }
  cf.el.style.opacity = fade.toFixed(2);
  const spread = drawer.state === 'opening' ? easeOut(drawer.openK) : 1;      // 가운데서 좌르륵 펼쳐진다
  if (!drawer.drag || drawer.drag.dir !== 'h') drawer.scroll += (drawer.sel - drawer.scroll) * Math.min(1, dt * 12);
  if (drawer.state !== 'inserting' && (!drawer.drag || drawer.drag.dir !== 'v')) drawer.pull += (0 - drawer.pull) * Math.min(1, dt * 14);

  for (let i = 0; i < cf.cards.length; i++){
    const o = cf.cards[i];
    const d = (i - drawer.scroll) * spread, ad = Math.abs(d);
    if (ad > 6.2){ if (o.vis){ o.c.style.display = 'none'; o.vis = false; } continue; }
    if (!o.vis){ o.c.style.display = ''; o.vis = true; }
    const t = Math.min(ad, 1), sg = d < 0 ? -1 : 1;
    const x = sg * (S * 0.74 * t + S * 0.22 * Math.max(0, ad - 1));
    const z = -S * 0.5 * t - S * 0.02 * Math.max(0, ad - 1);
    const ry = -sg * 66 * t;
    let y = 0, sc = 1;
    if (i === drawer.sel){ y = drawer.pull; sc = 1 - Math.min(0.55, Math.max(0, drawer.pull) / (S * 2)); }
    o.c.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,' + z.toFixed(1) + 'px) rotateY(' + ry.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
    o.c.style.zIndex = String(1000 - Math.round(ad * 100));
    o.c.style.opacity = ad > 5 ? String(Math.max(0, 6.2 - ad) / 1.2) : '1';
  }
}

/* ---------- 곡 바꾸기 (옆으로 쓸기) ---------- */
const SWIPE_PX = 60;
async function webChangeTrack(dir){          // 웹 미리보기: 데모 테이프를 돌려 가며 끼운다
  initCtx();
  if (!startSwap(dir)) return;
  stopSource(); pos = 0;
  tapeIdx = (tapeIdx + dir + TAPES.length) % TAPES.length;
  const t = TAPES[tapeIdx];
  try {
    if (!tapeBufs[tapeIdx]) tapeBufs[tapeIdx] = await buildDemo(t.bpm, t.seed);
    installBuffer(tapeBufs[tapeIdx]);
  } catch(e){}
  pendingLabel = {title: t.name, sub: t.sub};
}
function changeTrack(dir){                    // dir: 1 다음 곡, -1 이전 곡
  if (swap) return;
  if (NATIVE){
    if (sys.active){ pendingDir = dir; startSwap(dir); }
    try { dir > 0 ? window.NativeHost.next() : window.NativeHost.prev(); } catch(e){}
    return;
  }
  webChangeTrack(dir);
}

/* ---------- 터치: 톡 = 재생/정지, 양쪽 끝 길게 = 감기, 카세트 길게 = 음악 넣기 ---------- */
const EDGE = 0.16, HOLD_MS = 260, LONG_MS = 700, MOVE_PX = 14;
let press = null;
const zoneOf = x => {
  if (NATIVE) return 'mid';
  const w = window.innerWidth;
  return x < w * EDGE ? 'rew' : (x > w * (1 - EDGE) ? 'ff' : 'mid');
};
function clearPress(){
  if (!press) return;
  clearTimeout(press.hold); clearTimeout(press.long);
  if (press.seeking) releaseSeek(press.zone);
  press = null;
}

window.addEventListener('pointerdown', e => {
  clearPress();
  const p = {
    id: e.pointerId, x: e.clientX, y: e.clientY,
    zone: zoneOf(e.clientX),
    door: !!(e.target.closest && e.target.closest('#door')),
    keep: !!(e.target.closest && e.target.closest('#keepBtn')),
    close: !!(e.target.closest && e.target.closest('#closeBtn')),
    moved: false, seeking: false, fired: false, hold: null, long: null
  };
  if (!p.keep && !p.close && drawer.state !== 'closed' && drawerDown(e)) return;   // 서랍이 열려 있으면 서랍이 터치를 가져간다
  if (p.keep || p.close){ press = p; return; }
  if (p.zone !== 'mid'){
    p.hold = setTimeout(() => { p.seeking = true; pressSeek(p.zone); }, HOLD_MS);
  } else if (p.door){
    p.long = setTimeout(() => {
      if (!p.moved){
        p.fired = true;
        if (NATIVE) window.NativeHost.openAccess();
        else { initCtx(); el.file.click(); }
      }
    }, LONG_MS);
  }
  press = p;
});

window.addEventListener('pointermove', e => {
  if (drawer.drag && e.pointerId === drawer.drag.id){ drawerMove(e); return; }
  if (!press || e.pointerId !== press.id) return;
  if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > MOVE_PX){
    press.moved = true;
    if (!press.seeking){ clearTimeout(press.hold); clearTimeout(press.long); }
  }
});

function endPress(e){
  if (drawer.drag && e.pointerId === drawer.drag.id){ drawerUp(e.type === 'pointerup' ? e : null); return; }
  if (!press || e.pointerId !== press.id) return;
  const p = press;
  press = null;
  clearTimeout(p.hold); clearTimeout(p.long);
  if (p.keep){ if (!p.moved && e.type === 'pointerup') toggleKeep(); return; }
  if (p.close){ if (!p.moved && e.type === 'pointerup') onClose(); return; }
  if (p.seeking) releaseSeek(p.zone);
  else if (e.type === 'pointerup' && p.moved && !p.fired){
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.abs(dx) >= SWIPE_PX && Math.abs(dx) > Math.abs(dy) * 1.5) changeTrack(dx < 0 ? 1 : -1);
    else if (dy <= -SWIPE_PX && Math.abs(dy) > Math.abs(dx) * 1.5) openDrawer();      // 위로 쓸기 = 곡 서랍
  }
  else if (!p.fired && !p.moved && e.type === 'pointerup') togglePower();
}
window.addEventListener('pointerup', endPress);
window.addEventListener('pointercancel', endPress);
window.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 키보드(컴퓨터에서 볼 때) ---------- */
const keyMap = {ArrowUp:'ff', ArrowRight:'ff', ArrowDown:'rew', ArrowLeft:'rew'};
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (drawer.state !== 'closed'){                       // 곡 서랍이 열려 있을 때
    if (e.key === 'ArrowLeft'){ e.preventDefault(); drawerMove1(-1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); drawerMove1(1); }
    else if (e.key === 'ArrowDown' || e.key === 'Enter'){ e.preventDefault(); commitInsert(); }
    else if (e.key === 'ArrowUp' || e.key === 'Escape'){ e.preventDefault(); closeDrawer(); }
    return;
  }
  if (keyMap[e.key]){ e.preventDefault(); pressSeek(keyMap[e.key]); }
  else if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); togglePower(); }
});
window.addEventListener('keyup', e => {
  if (keyMap[e.key]){ e.preventDefault(); releaseSeek(keyMap[e.key]); }
});

/* ---------- 음악 불러오기 ---------- */
el.file.addEventListener('change', async () => {
  const f = el.file.files && el.file.files[0];
  if (!f) return;
  initCtx();
  if (!ctx) return;
  try {
    setNote('테이프 넣는 중…');
    const ab = await f.arrayBuffer();
    const b = await ctx.decodeAudioData(ab);
    const label = {title: f.name.replace(/\.[^.]+$/, ''), sub: '내 음악'};
    baseMode = 'play';
    if (startSwap(1)){
      stopSource();
      installBuffer(b);
      pendingLabel = label;
    } else {
      setBuffer(b, label.title, label.sub);
      apply();
    }
    setNote('');
  } catch(err){
    setNote('재생할 수 없는 파일이에요 (mp3, m4a, wav)');
  }
  el.file.value = '';
});

/* ---------- 화면 갱신 ---------- */
const MODE_TEXT = {stop:'정지', play:'재생 중', ff:'앞으로 감기', rew:'뒤로 감기', swap:'테이프 교체'};
const TARGET = {stop:0, play:-150, ff:-900, rew:900, swap:0};   // 릴 회전 속도(도/초)
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedScale = reduce ? 0.4 : 1;
let vel = 0, angL = 0, angR = 0, last = performance.now();
let shown = {mode:'', time:'', total:''};

function tick(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (NATIVE){
    mode = seekHold || (sys.playing ? 'play' : 'stop');
    const extra = (sys.playing && !seekHold) ? (performance.now() - sys.at) : 0;
    duration = sys.dur > 0 ? sys.dur / 1000 : 0;
    pos = Math.max(0, (sys.pos + extra) / 1000);
    if (duration && pos > duration) pos = duration;
  } else if (src && ctx){
    syncPos();
    if (mode === 'play' && pos >= duration - 0.02){ pos = 0; startSource(); }
    else if (mode === 'ff' && pos >= duration - 0.05){ pos = duration - 0.05; stopSource(); }
    else if (mode === 'rew' && pos <= 0.05){ pos = 0; stopSource(); }
  }

  const sw = stepSwap(now);
  if (!swap && pendingLabel){ setLabel(pendingLabel.title, pendingLabel.sub, pendingLabel.art); pendingLabel = null; }   // 늦게 도착한 라벨
  if (drawer.state !== 'closed') renderDrawer(now, dt);
  const vmode = swap ? 'swap' : mode;
  if (sw) el.cassette.setAttribute('transform',
    `translate(${(42 + sw.dx).toFixed(1)} ${(57 + sw.dy).toFixed(1)}) scale(1.46) rotate(${sw.rot.toFixed(2)} 160 98)`);
  vel += (TARGET[vmode] * speedScale - vel) * Math.min(1, dt * 7);
  const p = duration ? pos / duration : (NATIVE && sys.active ? 0.5 : 0);
  const rL = RMIN + (RMAX - RMIN) * (1 - p);
  const rR = RMIN + (RMAX - RMIN) * p;
  angL += vel * dt * (21 / rL);
  angR += vel * dt * (21 / rR);

  el.tapeL.setAttribute('r', rL.toFixed(2));
  el.tapeR.setAttribute('r', rR.toFixed(2));
  el.run.setAttribute('y1', (CL.y + rL).toFixed(2));
  el.run.setAttribute('y2', (CR.y + rR).toFixed(2));
  el.hubL.setAttribute('transform', `rotate(${angL.toFixed(1)} ${CL.x} ${CL.y})`);
  el.hubR.setAttribute('transform', `rotate(${angR.toFixed(1)} ${CR.x} ${CR.y})`);

  if (shown.mode !== vmode){
    shown.mode = vmode;
    el.modeText.textContent = MODE_TEXT[vmode];
    el.lamp.setAttribute('data-mode', vmode);
  }
  const ts = fmt(pos);
  if (shown.time !== ts){ shown.time = ts; el.time.textContent = ts; }
  const tt = duration > 0 ? '/ ' + fmt(duration) : '/ --:--';
  if (shown.total !== tt){ shown.total = tt; el.total.textContent = tt; }
  el.prog.setAttribute('width', (p * 220).toFixed(1));
  el.knob.setAttribute('cx', (556 + p * 220).toFixed(1));

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
