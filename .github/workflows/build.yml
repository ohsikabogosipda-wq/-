          package com.example.pocketwalk

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.ActivityManager
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebView

          /**
           * 워크맨 화면(assets/pocket-walk.html)을 보여주고,
           * 지금 폰에서 나오는 음악을 조종한다.
           *  - 앱을 열면 자동으로 "화면 고정"(앱 고정)을 요청한다
           *  - 뒤로 가기로는 닫히지 않고, 화면의 "닫기" 버튼을 눌러야 닫힌다
           *  - 화면 톡     : 재생 / 정지
           *  - 볼륨 +      : 누르는 동안 뒤로 감기
           *  - 볼륨 −      : 누르는 동안 앞으로 감기
           *  - 카세트 길게 : 알림 접근 설정 열기(곡 정보 / 감기에 필요)
           */
          class MainActivity : Activity() {

              private lateinit var web: WebView
              private lateinit var media: MediaBridge
              private var lockRequested = false
              private val prefs by lazy { getSharedPreferences("pocketwalk", MODE_PRIVATE) }

              /** 웹 화면이 부르는 기능들 */
              inner class NativeHost {
                  @JavascriptInterface
                  fun isNative(): Boolean = true

                  @JavascriptInterface
                  fun toggle() { runOnUiThread { media.toggle() } }

                  @JavascriptInterface
                  fun seekStart(kind: String) {
                      runOnUiThread { media.startSeek(if (kind == "ff") 1 else -1) }
                  }

                  @JavascriptInterface
                  fun seekStop() { runOnUiThread { media.stopSeek() } }

                  @JavascriptInterface
                  fun openAccess() { runOnUiThread { openAccessSettings() } }

                  @JavascriptInterface
                  fun closeApp() { runOnUiThread { exitApp() } }

                  @JavascriptInterface
                  fun getKeepScreenOn(): Boolean = prefs.getBoolean(KEY_KEEP_ON, true)

                  @JavascriptInterface
                  fun setKeepScreenOn(on: Boolean) {
                      prefs.edit().putBoolean(KEY_KEEP_ON, on).apply()
                      runOnUiThread { applyKeepOn(on) }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  applyKeepOn(prefs.getBoolean(KEY_KEEP_ON, true))

                  web = WebView(this)
                  web.setBackgroundColor(0xFFE9EAEC.toInt())
                  web.settings.javaScriptEnabled = true

                  media = MediaBridge(this) { json ->
                      web.evaluateJavascript("window.pocketWalk && pocketWalk.update($json)", null)
                  }
                  web.addJavascriptInterface(NativeHost(), "NativeHost")

                  web.loadUrl("file:///android_asset/pocket-walk.html")
                  setContentView(web)
                  hideSystemUi()
              }

              private fun applyKeepOn(on: Boolean) {
                  if (on) window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  else window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              /** 화면 고정(앱 고정) 요청. 처음에는 시스템이 확인 창을 띄운다 */
              private fun requestPin() {
                  try {
                      val am = getSystemService(ACTIVITY_SERVICE) as ActivityManager
                      if (am.lockTaskModeState == ActivityManager.LOCK_TASK_MODE_NONE) startLockTask()
                  } catch (e: Exception) {
                  }
              }

              /** 닫기: 고정을 풀고 앱을 완전히 닫는다 */
              private fun exitApp() {
                  try {
                      stopLockTask()
                  } catch (e: Exception) {
                  }
                  finishAndRemoveTask()
              }

              /** 다른 앱(설정)을 열려면 고정을 잠깐 풀어야 한다. 돌아오면 다시 고정을 요청한다 */
              private fun openAccessSettings() {
                  try {
                      stopLockTask()
                  } catch (e: Exception) {
                  }
                  lockRequested = false
                  try {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  } catch (e: Exception) {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              /** 뒤로 가기로는 닫히지 않는다. 화면의 닫기 버튼을 눌러야 한다 */
              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
              }

              // ----- 물리 볼륨 키 -> 감기 (누르는 동안만) -----
              private fun kindFor(keyCode: Int): String? = when (keyCode) {
                  KeyEvent.KEYCODE_VOLUME_UP -> "rew"
                  KeyEvent.KEYCODE_VOLUME_DOWN -> "ff"
                  else -> null
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  val kind = kindFor(keyCode) ?: return super.onKeyDown(keyCode, event)
                  if ((event?.repeatCount ?: 0) == 0) {
                      web.evaluateJavascript("window.pocketWalk && pocketWalk.press('$kind')", null)
                  }
                  return true // 시스템 볼륨 조절 창이 뜨지 않도록 키를 소비
              }

              override fun onKeyUp(keyCode: Int, event: KeyEvent?): Boolean {
                  val kind = kindFor(keyCode) ?: return super.onKeyUp(keyCode, event)
                  web.evaluateJavascript("window.pocketWalk && pocketWalk.release('$kind')", null)
                  return true
              }

              // ----- 생명주기 (음악은 계속 나오게 두고, 화면 갱신만 멈춘다) -----
              override fun onResume() {
                  super.onResume()
                  web.onResume()
                  media.start()
                  hideSystemUi()
                  if (!lockRequested) {
                      lockRequested = true
                      requestPin()
                  }
              }

              override fun onPause() {
                  media.stop()
                  web.onPause()
                  super.onPause()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      hideSystemUi()
                  } else {
                      // 키를 누른 채 다른 화면으로 넘어가도 감기가 남지 않게 한다
                      media.stopSeek()
                      web.evaluateJavascript(
                          "window.pocketWalk && (pocketWalk.release('ff'), pocketWalk.release('rew'))", null
                      )
                  }
              }

              @Suppress("DEPRECATION")
              private fun hideSystemUi() {
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      )
              }

              override fun onDestroy() {
                  web.destroy()
                  super.onDestroy()
              }

              companion object {
                  private const val KEY_KEEP_ON = "keepOn"
              }
          }
