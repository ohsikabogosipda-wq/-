              <path android:fillColor="#DDD9CD" android:pathData="M60,54m-8,0a8,8 0 1 0 16,0a8,8 0 1 0 -16,0" />
              <path android:fillColor="#15181D" android:pathData="M36,54m-3,0a3,3 0 1 0 6,0a3,3 0 1 0 -6,0" />
              <path android:fillColor="#15181D" android:pathData="M60,54m-3,0a3,3 0 1 0 6,0a3,3 0 1 0 -6,0" />
