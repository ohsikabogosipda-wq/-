          package com.example.pocketwalk

          import android.content.ComponentName
          import android.content.Context
          import android.media.AudioManager
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.KeyEvent
          import org.json.JSONObject

          /**
           * 지금 폰에서 나오고 있는 음악(스포티파이, 유튜브 뮤직 등)을 조종하고,
           * 곡 정보와 재생 상태를 웹 화면(카세트)으로 보낸다.
           *
           * - 곡 정보 / 감기: "알림 접근" 허용이 필요
           * - 재생 / 정지: 허용이 없어도 미디어 키로 동작
           * - 감기: 버튼을 누른 시간에 비례해서 움직인다 (눌러서 뗄 때까지 시간 x 배속)
           */
          class MediaBridge(
              private val ctx: Context,
              private val onState: (String) -> Unit
          ) {
              private val handler = Handler(Looper.getMainLooper())
              private val msm = ctx.getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
              private val listener = ComponentName(ctx, MediaListener::class.java)

              private var controller: MediaController? = null
              private var running = false
              private var tickCount = 0

              // 감기 상태
              private var seekDir = 0          // 1: 앞으로, -1: 뒤로, 0: 감기 아님
              private var seekBase = 0L        // 누르기 시작한 순간의 재생 위치(ms)
              private var seekStartAt = 0L     // 누르기 시작한 시각
              private var seekPos = 0L         // 지금 가리키는 위치(ms)
              private var seekEndAt = 0L
              private var lastSent = -1L
              private var lastFallbackAt = 0L
              private var stepped = false      // 실제로 위치를 옮긴 적이 있는지

              private val callback = object : MediaController.Callback() {
                  override fun onPlaybackStateChanged(state: PlaybackState?) { push() }
                  override fun onMetadataChanged(metadata: MediaMetadata?) { push() }
                  override fun onSessionDestroyed() { refresh() }
              }

              private val sessionsListener =
                  MediaSessionManager.OnActiveSessionsChangedListener { refresh() }

              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      tickCount++
                      if (tickCount % 4 == 0) refresh() else push()
                      handler.postDelayed(this, 500)
                  }
              }

              private val seekStep = object : Runnable {
                  override fun run() {
                      val c = controller
                      if (seekDir == 0 || c == null) return
                      val now = SystemClock.elapsedRealtime()
                      if (canSeek(c)) {
                          seekPos = targetPos(c, now)
                          if (seekPos != seekBase && seekPos != lastSent) {
                              c.transportControls.seekTo(seekPos)
                              lastSent = seekPos
                              stepped = true
                          }
                      } else if (now - lastFallbackAt >= FALLBACK_INTERVAL_MS) {
                          // 위치 이동을 지원하지 않는 앱: 앞/뒤로 감기 명령만 보낸다
                          lastFallbackAt = now
                          if (seekDir > 0) c.transportControls.fastForward() else c.transportControls.rewind()
                      }
                      push()
                      handler.postDelayed(this, SEEK_INTERVAL_MS)
                  }
              }

              fun start() {
                  if (running) return
                  running = true
                  if (hasAccess(ctx)) {
                      try {
                          msm.addOnActiveSessionsChangedListener(sessionsListener, listener, handler)
                      } catch (e: SecurityException) {
                      }
                  }
                  refresh()
                  handler.postDelayed(ticker, 500)
              }

              fun stop() {
                  running = false
                  handler.removeCallbacks(ticker)
                  handler.removeCallbacks(seekStep)
                  seekDir = 0
                  try {
                      msm.removeOnActiveSessionsChangedListener(sessionsListener)
                  } catch (e: Exception) {
                  }
                  controller?.unregisterCallback(callback)
                  controller = null
              }

              /** 재생 <-> 정지 */
              fun toggle() {
                  val c = controller
                  if (c == null) {
                      sendKey(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE)
                      return
                  }
                  if (c.playbackState?.state == PlaybackState.STATE_PLAYING) {
                      c.transportControls.pause()
                  } else {
                      c.transportControls.play()
                  }
              }

              /** 누르기 시작 (dir: 1 앞으로, -1 뒤로). 누른 시간만큼 위치가 움직인다 */
              fun startSeek(dir: Int) {
                  val c = controller ?: return
                  handler.removeCallbacks(seekStep)
                  seekDir = dir
                  seekBase = realPos(c.playbackState)
                  seekPos = seekBase
                  seekStartAt = SystemClock.elapsedRealtime()
                  lastSent = -1L
                  stepped = false
                  handler.postDelayed(seekStep, SEEK_INTERVAL_MS)
              }

              /** 뗀 순간: 누른 시간에 맞는 위치로 정확히 맞추고 끝낸다 */
              fun stopSeek() {
                  val c = controller
                  if (seekDir != 0 && c != null && canSeek(c)) {
                      val now = SystemClock.elapsedRealtime()
                      val t = targetPos(c, now)
                      if (t != seekBase || stepped) {
                          seekPos = t
                          if (t != lastSent) {
                              c.transportControls.seekTo(t)
                              lastSent = t
                          }
                          stepped = true
                          seekEndAt = now
                      }
                  }
                  seekDir = 0
                  handler.removeCallbacks(seekStep)
                  push()
              }

              // ---------------------------------------------------------------

              private fun canSeek(c: MediaController): Boolean {
                  val st = c.playbackState
                  return st != null && (st.actions and PlaybackState.ACTION_SEEK_TO) != 0L
              }

              private fun targetPos(c: MediaController, now: Long): Long {
                  val dur = c.metadata?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
                  val max = if (dur > 1000L) dur - 500L else Long.MAX_VALUE
                  return (seekBase + seekDir * SEEK_SPEED * (now - seekStartAt)).coerceIn(0L, max)
              }

              private fun refresh() {
                  if (!hasAccess(ctx)) {
                      controller?.unregisterCallback(callback)
                      controller = null
                      push()
                      return
                  }
                  val list: List<MediaController> = try {
                      msm.getActiveSessions(listener)
                  } catch (e: SecurityException) {
                      emptyList()
                  }
                  val pick = list.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                      ?: list.firstOrNull()
                  if (pick?.sessionToken != controller?.sessionToken) {
                      controller?.unregisterCallback(callback)
                      controller = pick
                      controller?.registerCallback(callback, handler)
                  }
                  push()
              }

              private fun realPos(st: PlaybackState?): Long {
                  if (st == null) return 0L
                  val base = if (st.position == PlaybackState.PLAYBACK_POSITION_UNKNOWN) 0L else st.position
                  val extra = if (st.state == PlaybackState.STATE_PLAYING) {
                      ((SystemClock.elapsedRealtime() - st.lastPositionUpdateTime) * st.playbackSpeed).toLong()
                  } else 0L
                  return (base + extra).coerceAtLeast(0L)
              }

              /** 감기 직후 잠깐은 방금 옮긴 위치를 보여줘서 화면이 튀지 않게 한다 */
              private fun displayPos(st: PlaybackState?): Long {
                  val now = SystemClock.elapsedRealtime()
                  if (seekDir != 0) return if (stepped) seekPos else realPos(st)
                  if (seekEndAt != 0L && now - seekEndAt < 1200L) {
                      val moving = st?.state == PlaybackState.STATE_PLAYING
                      return seekPos + if (moving) now - seekEndAt else 0L
                  }
                  return realPos(st)
              }

              private fun push() {
                  val c = controller
                  val o = JSONObject()
                  o.put("granted", hasAccess(ctx))
                  o.put("active", c != null)
                  if (c != null) {
                      val st = c.playbackState
                      val md = c.metadata
                      o.put("playing", st?.state == PlaybackState.STATE_PLAYING)
                      o.put("pos", displayPos(st))
                      o.put("dur", md?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L)
                      o.put("title", md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "")
                      o.put(
                          "artist",
                          md?.getString(MediaMetadata.METADATA_KEY_ARTIST)
                              ?: md?.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST) ?: ""
                      )
                  }
                  onState(o.toString())
              }

              private fun sendKey(code: Int) {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
              }

              companion object {
                  private const val SEEK_SPEED = 12L            // 누른 시간 1초당 12초 움직임
                  private const val SEEK_INTERVAL_MS = 100L     // 위치를 갱신하는 간격
                  private const val FALLBACK_INTERVAL_MS = 500L

                  /** "알림 접근"이 허용돼 있는지 */
                  fun hasAccess(ctx: Context): Boolean {
                      val flat = Settings.Secure.getString(ctx.contentResolver, "enabled_notification_listeners")
                          ?: return false
                      return flat.split(":").any {
                          ComponentName.unflattenFromString(it)?.packageName == ctx.packageName
                      }
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/example/pocketwalk/MediaListener.kt <<'EOF'
          package com.example.pocketwalk

          import android.service.notification.NotificationListenerService

          /**
           * 내용은 비어 있어도 된다.
           * 이 서비스가 "알림 접근" 허용을 받으면 MediaBridge가 지금 재생 중인 음악을 조종할 수 있다.
           */
          class MediaListener : NotificationListenerService()
          EOF
          gradle assembleDebug --no-daemon --console=plain

      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 포켓 워크 빌드 ${{ github.run_number }}
          files: _app/app/build/outputs/apk/debug/app-debug.apk
