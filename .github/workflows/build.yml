          cat > app/src/main/java/com/example/pocketwalk/MainActivity.kt <<'EOF'
          package com.example.pocketwalk

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import org.json.JSONObject

          /**
           * 워크맨 화면(assets/pocket-walk.html)을 보여주고,
           * 지금 폰에서 나오는 음악(유튜브 뮤직 등)을 조종한다.
           *  - 화면 고정 팝업은 띄우지 않는다
           *  - 뒤로 가기로는 닫히지 않는다 (곡 서랍이 열려 있으면 서랍만 닫는다). 화면의 "닫기"를 눌러야 닫힌다
           *  - 화면 톡     : 재생 / 정지
           *  - 볼륨 +      : 누르는 동안 뒤로 감기 (곡 서랍에서는 위로 한 칸)
           *  - 볼륨 −      : 누르는 동안 앞으로 감기 (곡 서랍에서는 아래로 한 칸)
           *  - 좌우 쓸기   : 다음 곡 / 이전 곡 (카세트를 갈아끼우는 효과)
           *  - 위로 쓸기   : 앨범 커버플로우 열기(옆으로 넘겨 고르고, 아래로 쓸어 카세트에 넣으면 재생)
           *  - 카세트 길게 : 알림 접근 설정 열기(곡 정보 / 감기 / 곡 목록에 필요)
           */
          class MainActivity : Activity() {

              private lateinit var web: WebView
              private lateinit var media: MediaBridge
              private lateinit var artLookup: ArtLookup
              private val prefs by lazy { getSharedPreferences("pocketwalk", MODE_PRIVATE) }

              /** 웹 화면이 부르는 기능들 */
              inner class NativeHost {
                  @JavascriptInterface
                  fun isNative(): Boolean = true

                  @JavascriptInterface
                  fun toggle() { runOnUiThread { media.toggle() } }

                  @JavascriptInterface
                  fun seekStart(kind: String) {
                      runOnUiThread { media.startSeek(if (kind == "ff") 1 else -1) }
                  }

                  @JavascriptInterface
                  fun seekStop() { runOnUiThread { media.stopSeek() } }

                  @JavascriptInterface
                  fun openAccess() { runOnUiThread { openAccessSettings() } }

                  @JavascriptInterface
                  fun next() { runOnUiThread { media.next() } }

                  @JavascriptInterface
                  fun prev() { runOnUiThread { media.previous() } }

                  @JavascriptInterface
                  fun playQueueItem(id: String) {
                      val n = id.toLongOrNull() ?: return
                      runOnUiThread { media.playQueueItem(n) }
                  }

                  @JavascriptInterface
                  fun playSearch(query: String) { runOnUiThread { media.playSearch(query) } }

                  /** 카세트를 빼고 끼울 때, 목록을 넘길 때 손에 오는 진동 */
                  @JavascriptInterface
                  fun haptic(kind: String) {
                      runOnUiThread {
                          val type = when (kind) {
                              "insert" -> HapticFeedbackConstants.KEYBOARD_TAP
                              "tick" -> HapticFeedbackConstants.CLOCK_TICK
                              else -> HapticFeedbackConstants.LONG_PRESS
                          }
                          web.performHapticFeedback(type)
                      }
                  }

                  /** 앨범 커버가 없는 곡의 커버를 인터넷에서 찾는다 (곡 제목과 가수만 보낸다) */
                  @JavascriptInterface
                  fun lookupArt(key: String, title: String, artist: String) {
                      artLookup.lookup(key, title, artist)
                  }

                  /** 같은 가수의 다른 곡들(커버 포함)을 찾아 곡 목록을 넓힌다 */
                  @JavascriptInterface
                  fun expandArtist(artist: String) {
                      artLookup.expand(artist)
                  }

                  @JavascriptInterface
                  fun closeApp() { runOnUiThread { exitApp() } }

                  @JavascriptInterface
                  fun getKeepScreenOn(): Boolean = prefs.getBoolean(KEY_KEEP_ON, true)

                  @JavascriptInterface
                  fun setKeepScreenOn(on: Boolean) {
                      prefs.edit().putBoolean(KEY_KEEP_ON, on).apply()
                      runOnUiThread { applyKeepOn(on) }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  applyKeepOn(prefs.getBoolean(KEY_KEEP_ON, true))

                  web = WebView(this)
                  web.setBackgroundColor(0xFFE9EAEC.toInt())
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true   // 최근 들은 곡 목록을 저장하는 데 쓴다

                  media = MediaBridge(
                      this,
                      onState = { json ->
                          web.evaluateJavascript("window.pocketWalk && pocketWalk.update($json)", null)
                      },
                      onQueue = { json ->
                          web.evaluateJavascript("window.pocketWalk && pocketWalk.setQueue($json)", null)
                      }
                  )
                  artLookup = ArtLookup(
                      onArt = { key, url, status ->
                          web.evaluateJavascript(
                              "window.pocketWalk && pocketWalk.artFound(" + JSONObject.quote(key) + "," +
                                  JSONObject.quote(url) + "," + JSONObject.quote(status) + ")", null
                          )
                      },
                      onSongs = { artist, json ->
                          web.evaluateJavascript(
                              "window.pocketWalk && pocketWalk.moreSongs(" + JSONObject.quote(artist) + "," + json + ")", null
                          )
                      }
                  )
                  web.addJavascriptInterface(NativeHost(), "NativeHost")

                  web.loadUrl("file:///android_asset/pocket-walk.html")
                  setContentView(web)
                  hideSystemUi()
              }

              private fun applyKeepOn(on: Boolean) {
                  if (on) window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  else window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              /** 닫기: 앱을 완전히 닫는다 */
              private fun exitApp() {
                  finishAndRemoveTask()
              }

              private fun openAccessSettings() {
                  try {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  } catch (e: Exception) {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              /** 뒤로 가기로는 앱이 닫히지 않는다. 곡 서랍이 열려 있으면 서랍만 닫는다 */
              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  web.evaluateJavascript("window.pocketWalk && pocketWalk.back()", null)
              }

              // ----- 물리 볼륨 키 -> 감기 (누르는 동안만) / 곡 서랍에서는 목록 넘기기 -----
              private fun kindFor(keyCode: Int): String? = when (keyCode) {
                  KeyEvent.KEYCODE_VOLUME_UP -> "rew"
                  KeyEvent.KEYCODE_VOLUME_DOWN -> "ff"
                  else -> null
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  val kind = kindFor(keyCode) ?: return super.onKeyDown(keyCode, event)
                  if ((event?.repeatCount ?: 0) == 0) {
                      web.evaluateJavascript("window.pocketWalk && pocketWalk.press('$kind')", null)
                  }
                  return true // 시스템 볼륨 조절 창이 뜨지 않도록 키를 소비
              }

              override fun onKeyUp(keyCode: Int, event: KeyEvent?): Boolean {
                  val kind = kindFor(keyCode) ?: return super.onKeyUp(keyCode, event)
                  web.evaluateJavascript("window.pocketWalk && pocketWalk.release('$kind')", null)
                  return true
              }

              // ----- 생명주기 (음악은 계속 나오게 두고, 화면 갱신만 멈춘다) -----
              override fun onResume() {
                  super.onResume()
                  web.onResume()
                  media.start()
                  hideSystemUi()
              }

              override fun onPause() {
                  media.stop()
                  web.onPause()
                  super.onPause()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      hideSystemUi()
                  } else {
                      // 키를 누른 채 다른 화면으로 넘어가도 감기가 남지 않게 한다
                      media.stopSeek()
                      web.evaluateJavascript(
                          "window.pocketWalk && (pocketWalk.release('ff'), pocketWalk.release('rew'))", null
                      )
                  }
              }

              @Suppress("DEPRECATION")
              private fun hideSystemUi() {
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      )
              }

              override fun onDestroy() {
                  web.destroy()
                  super.onDestroy()
              }

              companion object {
                  private const val KEY_KEEP_ON = "keepOn"
              }
          }
