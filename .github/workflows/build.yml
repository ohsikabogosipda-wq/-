          cat > app/src/main/java/com/example/pocketwalk/ArtLookup.kt <<'EOF'
          package com.example.pocketwalk

          import android.os.Handler
          import android.os.Looper
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors

          /**
           * 인터넷(iTunes 검색)으로
           *  1) 앨범 커버가 없는 곡의 커버를 찾고,
           *  2) 같은 가수의 다른 곡 목록(커버 포함)을 가져온다.
           * 보내는 것은 곡 제목과 가수 이름뿐이다. 여러 개를 동시에 처리해서 빠르게 채운다.
           */
          class ArtLookup(
              private val onArt: (String, String, String) -> Unit,   // 키, 커버 주소, 상태(ok / none / fail)
              private val onSongs: (String, String) -> Unit          // 가수, 곡 목록 JSON (실패하면 "null")
          ) {
              private val io = Executors.newFixedThreadPool(4)
              private val main = Handler(Looper.getMainLooper())
              private val askedArt: MutableSet<String> = ConcurrentHashMap.newKeySet()
              private val askedArtist: MutableSet<String> = ConcurrentHashMap.newKeySet()

              fun lookup(key: String, title: String, artist: String) {
                  if (title.isBlank()) {
                      main.post { onArt(key, "", "none") }
                      return
                  }
                  if (!askedArt.add(key)) {
                      main.post { onArt(key, "", "fail") }
                      return
                  }
                  io.execute {
                      var status = "fail"
                      var url = ""
                      try {
                          val r = fetchArt(title, artist)
                          if (r != null) {
                              status = if (r.isEmpty()) "none" else "ok"
                              url = r
                          }
                      } catch (e: Exception) {
                      }
                      if (status == "fail") askedArt.remove(key)      // 통신 문제면 나중에 다시 시도할 수 있게 둔다
                      main.post { onArt(key, url, status) }
                  }
              }

              fun expand(artist: String) {
                  if (artist.isBlank() || !askedArtist.add(artist)) return
                  io.execute {
                      val arr = try {
                          fetchSongs(artist)
                      } catch (e: Exception) {
                          null
                      }
                      if (arr == null) askedArtist.remove(artist)
                      main.post { onSongs(artist, arr?.toString() ?: "null") }
                  }
              }

              private fun httpGet(address: String): String? {
                  val conn = URL(address).openConnection() as HttpURLConnection
                  return try {
                      conn.connectTimeout = 4000
                      conn.readTimeout = 5000
                      if (conn.responseCode != 200) null
                      else conn.inputStream.bufferedReader().use { it.readText() }
                  } finally {
                      conn.disconnect()
                  }
              }

              private fun big(u: String) = u.replace("100x100bb", "300x300bb")

              /** 커버 주소, 검색 결과가 없으면 "", 통신에 실패하면 null */
              private fun fetchArt(title: String, artist: String): String? {
                  val term = URLEncoder.encode((title + " " + artist).trim(), "UTF-8")
                  var failed = false
                  for (country in listOf("KR", "US")) {
                      val body = httpGet(
                          "https://itunes.apple.com/search?term=" + term +
                              "&media=music&entity=song&limit=5&country=" + country
                      )
                      if (body == null) {
                          failed = true
                          continue
                      }
                      val arr = JSONObject(body).optJSONArray("results") ?: continue
                      var first = ""
                      for (i in 0 until arr.length()) {
                          val r = arr.optJSONObject(i) ?: continue
                          val u = r.optString("artworkUrl100", "")
                          if (u.isEmpty()) continue
                          if (first.isEmpty()) first = u
                          val who = r.optString("artistName", "")
                          if (artist.isNotBlank() && who.contains(artist, ignoreCase = true)) return big(u)
                      }
                      if (first.isNotEmpty()) return big(first)
                  }
                  return if (failed) null else ""
              }

              /** 같은 가수의 곡들(제목, 가수, 커버). 없으면 빈 배열, 통신에 실패하면 null */
              private fun fetchSongs(artist: String): JSONArray? {
                  val term = URLEncoder.encode(artist, "UTF-8")
                  var failed = false
                  for (country in listOf("KR", "US")) {
                      val body = httpGet(
                          "https://itunes.apple.com/search?term=" + term +
                              "&media=music&entity=song&attribute=artistTerm&limit=60&country=" + country
                      )
                      if (body == null) {
                          failed = true
                          continue
                      }
                      val res = JSONObject(body).optJSONArray("results") ?: continue
                      val out = JSONArray()
                      val seen = HashSet<String>()
                      for (i in 0 until res.length()) {
                          val r = res.optJSONObject(i) ?: continue
                          val name = r.optString("trackName", "")
                          val who = r.optString("artistName", "")
                          if (name.isEmpty() || !seen.add(name.lowercase())) continue
                          if (!who.contains(artist, ignoreCase = true) && !artist.contains(who, ignoreCase = true)) continue
                          val o = JSONObject()
                          o.put("title", name)
                          o.put("artist", who)
                          o.put("art", big(r.optString("artworkUrl100", "")))
                          out.put(o)
                          if (out.length() >= 40) break
                      }
                      if (out.length() > 0) return out
                  }
                  return if (failed) null else JSONArray()
              }
          }
