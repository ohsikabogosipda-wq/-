              <path android:fillColor="#B0BAC2" android:pathData="M12,22h72a8,8 0 0 1 8,8v36a8,8 0 0 1 -8,8h-72a8,8 0 0 1 -8,-8v-36a8,8 0 0 1 8,-8z" />
              <path android:fillColor="#EE6A22" android:pathData="M12,22h72a8,8 0 0 1 8,8v4h-88v-4a8,8 0 0 1 8,-8z" />
              <path android:fillColor="#15181D" android:pathData="M22,44h52v20h-52z" />
